services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: distributed-api-frontend

  redis:
    image: redis:7-alpine
    container_name: distributed-api-redis
    ports:
      - "6379:6379"

  api1:
    build: .
    container_name: distributed-api-1
    environment:
      PORT: 3000
      INSTANCE_ID: api-1
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/distributed_api
    ports:
      - "3001:3000"
    depends_on:
      - redis
      - postgres

  api2:
    build: .
    container_name: distributed-api-2
    environment:
      PORT: 3000
      INSTANCE_ID: api-2
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/distributed_api
    ports:
      - "3002:3000"
    depends_on:
      - redis
      - postgres

  api3:
    build: .
    container_name: distributed-api-3
    environment:
      PORT: 3000
      INSTANCE_ID: api-3
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://appuser:apppassword@postgres:5432/distributed_api
    ports:
      - "3003:3000"
    depends_on:
      - redis
      - postgres

  nginx:
    image: nginx:alpine
    container_name: distributed-api-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api1
      - api2
      - api3

  postgres:
    image: postgres:17-alpine
    container_name: distributed-api-postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: distributed_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:    